name: publish-images
on:
  push:
    branches: [main]
    # Only what the Dockerfiles use: src/, pyproject.toml, uv.lock, gpu/ and web/
    # (README.md is replaced by an empty stub, so it is not listed); docs, tests,
    # Compose and CI-only changes keep the current images.
    # Add a path here when a Dockerfile starts copying it.
    paths:
      - src/**
      - pyproject.toml
      - uv.lock
      - gpu/**
      - docker/**
      - web/**
      - .github/workflows/publish-images.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One publish at a time: two runs started by back-to-back merges both missed the cache and
# raced for `latest`. A new run waits for the current one; GitHub keeps only the newest
# waiting run, so an in-between merge may get no SHA tag (pin the newest published SHA).
concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [app, tools]
    steps:
      - uses: actions/checkout@v4
      - name: Free disk for GPU image
        if: matrix.image == 'tools'
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Layer cache in the registry (like v2a_inspect): a run rebuilds only the layers
      # whose inputs changed. The buildcache tag is a cache manifest, not a runnable image.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: true
          tags: |
            ghcr.io/capstone-audissey-fall-2026/audyssey-${{ matrix.image }}:latest
            ghcr.io/capstone-audissey-fall-2026/audyssey-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/capstone-audissey-fall-2026/audyssey-${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/capstone-audissey-fall-2026/audyssey-${{ matrix.image }}:buildcache,mode=max,compression=zstd,compression-level=3,force-compression=true
