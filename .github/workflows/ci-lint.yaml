name: ci-lint
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-format-check:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.14"

      - name: venv cache
        id: sca_data_venv_cache
        uses: actions/cache@v4
        with:
          key: cache-key-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          path: |
            ./.venv

      - name: Sync venv
        if: ${{ steps.venv-cache.outputs.cache-hit != 'true' }}
        run: |
          uv sync --dev --locked --extra ui --extra llm

      - name: lint
        run: |
          uv run ruff check --exit-non-zero-on-fix --no-cache --output-format github src/

      - name: format
        run: |
          uv run ruff format --check --no-cache --output-format github src/

      - name: type-check
        run: |
          uv run ty check --output-format github --error-on-warning src/

      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: unit-tests
        run: |
          uv run python -m unittest discover tests

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  numpy-1x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install UV
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.14"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test Python 3.12 with numpy 1.26
        run: uv run --isolated --no-project --python 3.12 --with-editable '.[ui,llm]' --with 'numpy==1.26.4' python -m unittest discover tests

  # Builds the images without pushing, so a broken Dockerfile or dependency fails
  # the PR instead of the publish after merge. The 23 GB tools image only builds
  # when its inputs change.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Does this change touch the tools image?
        id: tools
        run: |
          base=${{ github.event.pull_request.base.sha || github.event.before }}
          if git diff --name-only "$base" HEAD | grep -qE '^(docker/tools\.Dockerfile|gpu/|src/audyssey/tools/|src/audyssey/toolserver\.py|pyproject\.toml|uv\.lock)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          push: false
      - name: Free disk for GPU image
        if: steps.tools.outputs.changed == 'true'
        run: sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
      - name: Build tools image
        if: steps.tools.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tools.Dockerfile
          push: false
