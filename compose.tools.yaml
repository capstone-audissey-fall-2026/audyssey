# GPU 호스트에서 도구 4개(분리, Judge, 그라운딩, 생성)만 한 컨테이너로 띄웁니다.
# main(화면)은 다른 기기에서 돌리고 화면의 "GPU tools"나 .env로 연결합니다 (docs/running.md#3-로컬-app--원격-gpu-tools).
#   docker compose -f compose.tools.yaml up -d
name: audyssey-tools

services:
  tools:
    image: ghcr.io/capstone-audissey-fall-2026/audyssey-tools:${AUDYSSEY_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/tools.Dockerfile
    # 이미지 기본 명령: 도구 4개를 real로 0.0.0.0:8700에 띄움 (토큰이 없으면 시작하지 않음)
    # 기본은 이 호스트의 loopback만. Docker가 공개한 포트는 ufw 같은 호스트 방화벽을 거치지 않으므로
    # 다른 기기에서 직접 접속하려면 AUDYSSEY_TOOLS_BIND=0.0.0.0을 명시하고, 아니면 SSH 터널을 씁니다.
    ports: ["${AUDYSSEY_TOOLS_BIND:-127.0.0.1}:${AUDYSSEY_TOOLS_PORT:-8700}:8700"]
    env_file: .env
    environment:
      HF_HOME: /hf
      HF_HUB_OFFLINE: "1"
      CUDA_VISIBLE_DEVICES: "0"
      AUDYSSEY_TOOL_TOKEN: ${AUDYSSEY_TOOL_TOKEN:?set AUDYSSEY_TOOL_TOKEN in .env}
    volumes: ["${HF_CACHE:-~/.cache/huggingface}:/hf:ro"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${AUDYSSEY_TOOLS_GPU:-0}"]
              capabilities: [gpu]
